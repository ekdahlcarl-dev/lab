name: ORBIT CI

on:
  pull_request:
    paths:
      - "orbit/**"
      - ".github/workflows/orbit-ci.yml"
  push:
    branches: [main]
    paths:
      - "orbit/**"
      - ".github/workflows/orbit-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      ORBIT_ENV: test
      ORBIT_SERVICE_NAME: orbit-ci
      DATABASE_URL: postgres://orbit:orbit@localhost:5433/orbit
      OBJECT_STORAGE_DRIVER: local
      OBJECT_STORAGE_LOCAL_DIR: .orbit-storage
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orbit/package-lock.json
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
